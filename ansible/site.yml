---
# This playbook can set up:
# - A Jenkins coordinator node, though most of the Jenkins configuration is still manual.
# - A Jenkins worker node, though most of the Jenkins configuration is still manual.
# - A hibernate.org/in.relation.to website node.

- hosts: jenkins-worker
  remote_user: fedora
  become: yes
  roles:
    - common
    - aws
    - instance-storage
    - jenkins-common
    - jenkins-worker
    - jenkins-worker-aws
    - role: uptycs
      uptycs_updates_tag: "NONE"

- hosts: jenkins-coordinator
  remote_user: fedora
  become: yes
  pre_tasks:
    - name: Install Jenkins repo
      ansible.builtin.import_tasks: tasks/repo/jenkins.yml
  roles:
    - common
    - aws
    - jenkins-common
    - jenkins-coordinator
    - uptycs

- hosts: websites
  remote_user: ec2-user
  become: yes
  roles:
    - common
    - websites

- hosts: ci-nexus-proxy
  remote_user: fedora
  become: yes
  roles:
    - common
    - aws
    - instance-storage
    - ci-nexus-proxy
    - uptycs
