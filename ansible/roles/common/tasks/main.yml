---
# Configure journald
- name: Apply journald configuration for minimum overhead and storage costs
  copy: src=journald.conf dest=/etc/systemd/journald.conf owner=root group=root mode=0644
  notify: Restart journald
  tags:
    - journald

- name: Remove old journald stored logs from disk
  file: path=/var/log/journal state=absent
  tags:
    - journald

- name: Replace curl-minimal with curl (Amazon Linux ships curl-minimal, which conflicts)
  shell: dnf swap -y curl-minimal curl
  args:
    removes: /usr/bin/curl
  register: curl_swap
  changed_when: "'Nothing to do' not in curl_swap.stdout"
  failed_when: curl_swap.rc != 0 and 'No match for argument' not in curl_swap.stderr
  tags:
    - extra-packages

- name: Extra packages for convenience
  dnf:
    name: ['wget', 'jq', 'sed', 'curl', 'unzip', 'vim']
    state: present
  tags:
    - extra-packages

- name: Check for Amazon Linux release upgrade
  shell: dnf check-release-update 2>&1
  register: release_update_check
  changed_when: "'newer release' in release_update_check.stdout"
  failed_when: false
  notify: Warn about Amazon Linux release upgrade

# Update and install packages, using dnf
- name: Install all package upgrades using dnf
  dnf:
    name: "*"
    state: latest
  notify:
     - Restart server

# Hostname and hosts file
- name: Set the hostname
  hostname: name={{ hostname }}
  tags:
    - hostname

- name: Setup the hosts file to workaround Java RMI limitations
  template: src=hosts dest=/etc/hosts
  tags:
    - hostname
